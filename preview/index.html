 const nome=d.querySelector('#nome').value.trim(),email=d.querySelector('#mail').value.trim(),zap=d.querySelector('#zap').value.replace(/\D/g,'');
 const ok={nome:nome.length>=2,mail:/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email),zap:zap.length===10||zap.length===11};
 Object.keys(ok).forEach(k=>d.querySelector('#'+k).parentNode.classList.toggle('erro',!ok[k]));

 return{nome,email,whatsapp:zap,hp:d.querySelector('#hp').value};

 return fetch(LEAD_URL,{method:'POST',mode:'no-cors',headers:{'content-type':'text/plain;charset=utf-8'},body:corpo,keepalive:true}).catch(()=>{});

 <div class="err" id="err" role="alert"></div>`;
const BONUS=`<div class="bonus"><h3>🎁 Grupo VIP no WhatsApp</h3><ul>
 <li>Novidades em primeira mão</li><li>Os nichos que mais compram site</li><li>Os sistemas que as empresas mais compram</li>
 <li><b>Um bônus especial só pra quem está no grupo</b></li></ul></div>`;
const LGPD=`<p class="lock">🔒 Seus dados ficam só com a gente. Ao enviar, você aceita receber o seu resultado e novidades por WhatsApp e e-mail. Pra sair, é só pedir.</p>`;

/* ===== RENDER ===== */
function go(n,push=true){if(push)H.push(i);i=n;render()}
function render(){
 let s=S[i];
 /* quem já deixou o contato não vê o formulário de novo */
 if(s.t==='captura'&&contato){i++;s=S[i]}
 window.scrollTo(0,0);
 prog.style.width=Math.round(i/(S.length-1)*100)+'%';
 backBtn.style.visibility=(H.length&&s.t!=='load')?'visible':'hidden';
 if(!metade&&i>=META_I){metade=true;pxc('QuizMetade')}
 app.innerHTML='';const d=document.createElement('div');d.className='step';app.appendChild(d);
 ({q,info,load,result,plano,oferta,captura})[s.t](s,d);
}
function q(s,d){
 let h='';
 if(s.intro)h+=`<span class="tag">Preencha o quiz e descubra se você está pronto:</span><h1>Crie sites com <em>IA</em> e venda pra negócios da sua cidade</h1><p class="sub"><b>Descubra se você está qualificado</b> pra fazer renda extra com a Máquina de Sites.</p><p class="sub" style="font-size:12px;letter-spacing:.06em">↓ RESPONDA PARA COMEÇAR ↓</p><h2 style="margin-top:26px;font-size:22px">${s.h}</h2>`;
 else h+=`<h2>${s.h}</h2>`+(s.sub?`<p class="sub">${s.sub}</p>`:'');
 h+=`<div class="opts ${s.two?'two':''}">`+s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]?`<span class="e">${o[0]}</span>`:''}<span>${o[1]}</span></button>`).join('')+'</div>';
 d.innerHTML=h;
 d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.add('sel');A[s.id]=s.o[b.dataset.k][1];
  if(!iniciou){iniciou=true;pxc('QuizIniciado')}
  setTimeout(()=>go(i+1),220)});
}
/* captura logo depois da 1ª resposta: bônus do grupo em troca do contato (pode pular) */
function captura(s,d){
 d.innerHTML=`<span class="tag verde">🎁 Bônus pra quem responde</span>
 <h2>Antes de continuar: pra onde eu mando o seu bônus?</h2>
 <p class="sub">Deixa seu contato e, no final do quiz, você <b>libera o acesso ao grupo VIP</b>:</p>
 ${BONUS}${CAMPOS}
 <button class="btn green" id="ok">Liberar meu bônus e continuar</button>${LGPD}
 <button class="pular" id="pula">Continuar sem o bônus</button>`;
 mascaraFone(d.querySelector('#zap'));
 d.querySelector('#ok').onclick=()=>{const c=lerContato(d);if(!c)return;contato=c;
  px('Lead',{content_name:'quiz',momento:'inicio'});enviaLead('inicio');go(i+1)};
 d.querySelector('#pula').onclick=()=>go(i+1);
}
function info(s,d){d.innerHTML=`<h2>${s.h}</h2>${s.body}<button class="btn">Continuar</button>`;d.querySelector('.btn').onclick=()=>go(i+1)}
function load(s,d){
 const steps=['Analisando suas respostas','Cruzando com o perfil de quem começa bem','Calculando seu nível de prontidão','Montando o seu plano'];
 d.innerHTML=`<div class="load"><p class="sub">Carregando...</p><div class="pct" id="pct">0%</div><p class="sub">Com base nas suas respostas, estamos calculando o seu potencial na <b>Máquina de Sites</b>.</p><ul>${steps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 let p=0;const lis=d.querySelectorAll('li');const t=setInterval(()=>{p+=2;d.querySelector('#pct').textContent=p+'%';lis.forEach((l,k)=>{if(p>=(k+1)*25-10)l.classList.add('on')});if(p>=100){clearInterval(t);setTimeout(()=>go(i+1,false),400)}},75);
}
function score(){
 let p=58;const g=(k,m)=>m[A[k]]||0;
 p+=g('ia',{'Uso todo dia':9,'Já usei algumas vezes':7,'Conheço, mas nunca usei':4,'Nunca usei':2});
 p+=g('negocios',{'Conheço vários':8,'Conheço alguns':5,'Nunca reparei':2});
 p+=g('tempo',{'Mais de 2 horas':8,'1 a 2 horas':7,'30 min a 1h':5,'Menos de 30 min':3});
 p+=g('motivo',{'Renda extra imediata':6,'Sair do emprego atual':6,'Liberdade financeira':5,'Viver da internet':5});
 return Math.min(96,p);
}
function result(s,d){
 const sc=score();A._score=sc;
 const TEMPO={'Mais de 2 horas':'Com mais de 2 horas por dia, dá pra ter o 1º site pronto e apresentado ainda hoje.','1 a 2 horas':'Com 1 a 2 horas por dia, o 1º site sai pronto e apresentado ainda nesta semana.','30 min a 1h':'Com 30 min a 1h por dia, você instala num dia e deixa o 1º site pronto no seguinte.','Menos de 30 min':'Mesmo com menos de 30 min por dia dá pra começar: o site fica pronto em menos de 20 minutos.'};
 const dev=TEMPO[A.tempo]||'Você tem o tempo que o método pede.';
 const tempoAlto=['Mais de 2 horas','1 a 2 horas'].includes(A.tempo);
 const iaTxt=['Uso todo dia','Já usei algumas vezes'].includes(A.ia)?'Você já tem intimidade com IA, e isso encurta a sua curva de aprendizado.':'Não tem problema nunca ter usado IA: o método ensina o passo a passo do zero.';
 const neg=A.negocios==='Nunca reparei'?'Depois da 1ª aula você passa a ver oportunidade em todo negócio sem site da sua cidade.':'Você já enxerga negócios locais que precisam de site, e esse é o seu mercado.';
 const mot=`Sua maior motivação é <b>${(A.motivo||'').toLowerCase()}</b>: o método foi montado pra gerar o 1º resultado rápido, sem você largar nada.`;
 d.innerHTML=`<p class="sub" style="margin:0 0 10px">Aqui está o seu resultado...</p>
 <div class="res">Seu nível de prontidão para a Máquina de Sites</div>
 <div class="score"><div class="ring" style="--p:${sc}"><span>${sc}%</span></div></div>
 <div class="meter"><label><span>Tempo pra começar</span><span>${tempoAlto?'Ótimo':'Bom'}</span></label><i><s style="background:var(--green);width:${tempoAlto?'92':'72'}%"></s></i></div>
 <div class="meter"><label><span>Intimidade com IA</span><span>${['Uso todo dia','Já usei algumas vezes'].includes(A.ia)?'Alta':'Iniciante'}</span></label><i><s style="background:var(--or);width:${['Uso todo dia','Já usei algumas vezes'].includes(A.ia)?'85':'35'}%"></s></i></div>
 <div class="meter"><label><span>Mercado ao seu redor</span><span>${A.negocios==='Conheço vários'?'Grande':'Bom'}</span></label><i><s style="background:var(--green);width:${A.negocios==='Conheço vários'?'90':'65'}%"></s></i></div>
 <h2 style="margin-top:28px;font-size:22px">Você respondeu que...</h2>
 <div class="card"><h3>⏰ Seu tempo</h3><p>${dev}</p></div>
 <div class="card"><h3>🤖 Inteligência artificial</h3><p>${iaTxt}</p></div>
 <div class="card"><h3>🏪 Mercado</h3><p>${neg}</p></div>
 <div class="card"><h3>🎯 Motivação</h3><p>${mot}</p></div>
 <p class="sub" style="margin-top:22px">Por isso você está <b class="g">qualificado(a)</b>. Clique abaixo e entenda como começar ainda hoje.</p>
 <button class="btn green">Continuar</button>
 <p class="note">Esta é uma estimativa de prontidão baseada nas suas respostas, não uma promessa de ganho.</p>`;
 d.querySelector('.btn').onclick=()=>go(i+1);
 if(contato)enviaLead('concluiu');
 pxc('QuizConcluido',{prontidao:sc,sexo:A.sexo||'',idade:A.idade||''});
 px('ViewContent',{content_name:PRODUTO.nome,content_ids:[PRODUTO.id],content_type:'product',value:PRODUTO.valor,currency:PRODUTO.moeda});
}
function plano(s,d){
 d.innerHTML=`<h2>Seu plano para o 1º cliente</h2><p class="sub">Com base em tudo que você respondeu, este é o caminho da <b>Máquina de Sites</b>:</p>
 <div class="flow">
  <div><b>1</b><span><strong>Dia 1: monte a máquina</strong>Instale a ferramenta uma vez só. Codex e Antigravity têm plano gratuito.</span></div>
  <div><b>2</b><span><strong>Dia 2: crie o 1º site</strong>Escolha um negócio da sua cidade e deixe o site dele pronto pra vender em menos de 20 minutos.</span></div>
  <div><b>3</b><span><strong>Dia 3: apresente pro dono</strong>A Prospecção Automática leva o site pronto até a empresa, pelo WhatsApp e pelo e-mail.</span></div>
  <div><b>4</b><span><strong>Depois: feche e repita</strong>Quem gosta do que viu, fecha. Você repete o processo com o próximo negócio.</span></div>
 </div>
 <p class="sub" style="margin-top:6px">Você fala com o dono <b>depois</b> de ter o site pronto na mão. Esse é o segredo.</p>
 <button class="btn">Quero receber o meu plano</button>`;
 d.querySelector('.btn').onclick=()=>go(i+1);
}
function oferta(s,d){
 const nome=contato?contato.nome.split(' ')[0]:'';
 if(contato&&!concluiu){concluiu=true;enviaLead('concluiu')}
 d.innerHTML=`<span class="tag verde">Plano liberado${nome?', '+nome.replace(/[<>&]/g,''):''}</span>
 <h2>Seu acesso à <em>Máquina de Sites</em> está pronto</h2>
 <p class="sub">Os 3 produtos pra criar, apresentar e vender pra negócios da sua cidade usando a <b>Entrega Invertida</b>:</p>
 <ul class="itens">
  <li><b>Máquina de Sites<small>Site pronto pra vender em menos de 20 minutos</small></b><span>R$ 297</span></li>
  <li><b>Prospecção Automática<small>Pelo WhatsApp e pelo e-mail profissional</small></b><span>R$ 197</span></li>
  <li><b>Dando Vida a Sistemas com IA<small>Software com IA vendido como sistema</small></b><span>R$ 197</span></li>
 </ul>
 <div class="price"><s>De R$ 691</s><b>R$ 97</b><small>os 3 produtos · pagamento único · acesso imediato</small></div>
 <a class="btn green" id="comprar" href="${DESTINO}">Quero os 3 por R$ 97</a>
 <div class="garantia"><span class="s">7<br>DIAS</span><p><b>O risco é meu.</b> Seguiu o método e não funcionou pra você? Pede o dinheiro de volta em até 7 dias.</p></div>
 ${contato?`<div class="grupo">${BONUS}<a class="btn" id="grupo" href="${GRUPO_URL}" target="_blank" rel="noopener">Entrar no grupo VIP</a></div>`:''}
 <p class="note">Resultados variam e dependem da sua dedicação. Não há promessa de ganho.</p>`;
 d.querySelector('#comprar').onclick=()=>px('InitiateCheckout',{content_name:PRODUTO.nome,content_ids:[PRODUTO.id],content_type:'product',value:PRODUTO.valor,currency:PRODUTO.moeda,botao:'quiz-novo'});
 const g=d.querySelector('#grupo');if(g)g.onclick=()=>pxc('GrupoVIP');
}
backBtn.onclick=()=>{if(H.length){i=H.pop();
 while((S[i].t==='load'||(S[i].t==='captura'&&contato))&&H.length)i=H.pop();render()}};
render();
</script>
</body>
</html>
